<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="${ttype == 'SPIRALIS'} ? ~{layoutspi :: layout(~{::content})} : (${ttype == 'MOBRAIN'} ? ~{layoutgre :: layout(~{::content})} : ~{layoutrus :: layout(~{::content})})">
<body>
<div th:fragment="content">
    <form action="/getpin" method="post" id="wepa">
        <div class="row">
            <div class="col-md-12">GANA YA!!
                <hr style="margin-top: 5px; width: 50%; color: white; height: 2px; "/>
            </div>
        </div>
        <div class="row formst">
            <div class="col-md-12">
                Número de Celular <br/>
                <input style="width: 50%; color:black; text-align: center ; font-size:  2.5vmin;" type="number" min="0" step="1" id="msisdn" name="msisdn" th:value="${msisdn}"/>
                <input name="token" type="hidden" th:value="${token}"/>
                <input name="ttype" type="hidden" th:value="${ttype}"/>
                <br><br>
                <button id="checker" type="submit" class="submitbutton">ENVIAR!</button>
                <br>
                Al presionar el boton ENVIAR! usted confirma ha leído y acepta los términos y condiciones de uso.
            </div>
        </div>
        <br/>
    </form>
</div>
</body>
</html>
