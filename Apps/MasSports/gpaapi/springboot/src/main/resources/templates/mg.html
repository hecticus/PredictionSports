<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gracias</title>
    <style>
        body, html { height: 100%; overflow: hidden; }
        .bg {
            background-image: url("../assets/images/maxgame/banner.gif");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
        }
    </style>
</head>
<body>
<a href="sms:3030?&body=QUIERO PARTICIPAR" onClick="sendMessage()"><div class="bg"></div></a>
<script th:inline="javascript">
    var requestOptions = { method: 'GET', redirect: 'follow' };

    function sendMessage(){
        fetch("mark_maxgame?clickid=" + [[${clickValue}]] + "&SOURCE=" + [[${extras}]], requestOptions)
            .then(response => response.text())
            .then(result => console.log(result))
            .catch(error => console.log('error', error));
    }

    setTimeout(() => {
        fetch("https://ifconfig.me/all.json", requestOptions)
            .then(response => response.text())
            .then(result => {
                result = JSON.parse(result);
                fetch("ip_maxgame?clickid=" + [[${clickValue}]] + "&ip=" + result.ip_addr, requestOptions)
                    .then(response => response.text())
                    .then(result => console.log(result))
                    .catch(error => console.log('error', error));
            });
    }, 1000);
</script>
</body>
</html>
